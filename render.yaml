databases:
  - name: wavefinder-db
    databaseName: wavefinder
    user: wavefinder
    plan: free

services:
  # Backend API (Fastify)
  - type: web
    name: wavefinder-server
    runtime: node
    plan: free
    autoDeploy: yes
    buildCommand: npm install && cd server && npm run build && npx prisma db push
    startCommand: cd server && npm start
    # Liveness only - does not touch the database, so a DB blip cannot get the
    # whole service restarted. Use /health/ready when diagnosing a deploy.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: wavefinder-db
          property: connectionString
      - key: REDIS_URL
        sync: false  # Paste your Upstash Redis URL here after setup
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        # REQUIRED. Drives the CORS allowlist - the browser is blocked without it.
        # Set after the frontend deploys, e.g. https://wavefinder-client.onrender.com
        sync: false
      - key: CORS_ORIGINS
        # Optional, comma separated. Extra browser origins (custom domain,
        # preview deploys) allowed alongside FRONTEND_URL.
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # Frontend (React + Vite Static Site)
  - type: web
    name: wavefinder-client
    runtime: static
    autoDeploy: yes
    buildCommand: npm install && cd client && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        # REQUIRED, and must end in /api. Vite inlines this at BUILD time, so
        # changing it needs a redeploy of this static site, not just a restart.
        sync: false  # e.g. https://wavefinder-server.onrender.com/api
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_MAPBOX_TOKEN
        # REQUIRED for maps. Frontend only - the server never uses Mapbox.
        # Also inlined at build time.
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
